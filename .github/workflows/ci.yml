name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nusacbt_test
          POSTGRES_USER: nusacbt_test
          POSTGRES_PASSWORD: postgres-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: nusacbt_test
      PGUSER: nusacbt_test
      PGPASSWORD: postgres-test-only
      NUSACBT_COOKIE_SECURE: "false"
      TEST_ADMIN_USERNAME: admin_tes
      TEST_ADMIN_PASSWORD: admin-password-test-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      # File uji dibuat acak di luar checkout dan tidak pernah diunggah sebagai artefak.
      - run: |
          echo "NUSACBT_PARTICIPANT_KEY_FILE=${RUNNER_TEMP}/nusacbt-participant-test.key" >> "$GITHUB_ENV"
          echo "NUSACBT_EXAM_TOKEN_KEY_FILE=${RUNNER_TEMP}/nusacbt-token-test.key" >> "$GITHUB_ENV"
          npm run participant:key:create -- "${RUNNER_TEMP}/nusacbt-participant-test.key"
          npm run token:key:create -- "${RUNNER_TEMP}/nusacbt-token-test.key"
      - run: npm run db:migrate && npm run db:migrate
      - run: printf '%s' "$TEST_ADMIN_PASSWORD" | npm run admin:create -- "$TEST_ADMIN_USERNAME" --stdin
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      # Database kedua kosong dan khusus fixture upgrade; tidak menyentuh DB E2E.
      - name: Siapkan database upgrade fiktif
        run: |
          node --input-type=module -e "import pg from 'pg'; const c = new pg.Client(); await c.connect(); await c.query(\"CREATE DATABASE nusacbt_upgrade_015_test ENCODING 'UTF8'\"); await c.end();"
      - name: Uji upgrade dari migrasi 014 ke terbaru
        env:
          PGDATABASE: nusacbt_upgrade_015_test
          NUSACBT_CONFIRM_TEST_DATABASE: nusacbt_upgrade_015_test
        run: npm run test:upgrade
      - name: Siapkan database upgrade 016 fiktif
        run: |
          node --input-type=module -e "import pg from 'pg'; const c = new pg.Client(); await c.connect(); await c.query(\"CREATE DATABASE nusacbt_upgrade_016_test ENCODING 'UTF8'\"); await c.end();"
      - name: Uji upgrade dari migrasi 015
        env:
          PGDATABASE: nusacbt_upgrade_016_test
          NUSACBT_CONFIRM_TEST_DATABASE: nusacbt_upgrade_016_test
        run: npm run test:upgrade-016
      - name: Siapkan database upgrade 017 fiktif
        run: |
          node --input-type=module -e "import pg from 'pg'; const c = new pg.Client(); await c.connect(); await c.query(\"CREATE DATABASE nusacbt_upgrade_017_test ENCODING 'UTF8'\"); await c.end();"
      - name: Uji upgrade dari migrasi 016
        env:
          PGDATABASE: nusacbt_upgrade_017_test
          NUSACBT_CONFIRM_TEST_DATABASE: nusacbt_upgrade_017_test
        run: npm run test:upgrade-017
      - name: Siapkan database upgrade 018 fiktif
        run: |
          node --input-type=module -e "import pg from 'pg'; const c = new pg.Client(); await c.connect(); await c.query(\"CREATE DATABASE nusacbt_upgrade_018_test ENCODING 'UTF8'\"); await c.end();"
      - name: Uji upgrade dari migrasi 017
        env:
          PGDATABASE: nusacbt_upgrade_018_test
          NUSACBT_CONFIRM_TEST_DATABASE: nusacbt_upgrade_018_test
        run: npm run test:upgrade-018
      - name: Siapkan database upgrade 019 fiktif
        run: |
          node --input-type=module -e "import pg from 'pg'; const c = new pg.Client(); await c.connect(); await c.query(\"CREATE DATABASE nusacbt_upgrade_019_test ENCODING 'UTF8'\"); await c.end();"
      - name: Uji upgrade dari migrasi 018 berisi pengerjaan
        env:
          PGDATABASE: nusacbt_upgrade_019_test
          NUSACBT_CONFIRM_TEST_DATABASE: nusacbt_upgrade_019_test
        run: npm run test:upgrade-019
      - name: Siapkan database upgrade 020 fiktif
        run: |
          node --input-type=module -e "import pg from 'pg'; const c = new pg.Client(); await c.connect(); await c.query(\"CREATE DATABASE nusacbt_upgrade_020_test ENCODING 'UTF8'\"); await c.end();"
      - name: Uji upgrade dari migrasi 019 ke pengaturan nilai
        env:
          PGDATABASE: nusacbt_upgrade_020_test
          NUSACBT_CONFIRM_TEST_DATABASE: nusacbt_upgrade_020_test
        run: npm run test:upgrade-020
      - name: Siapkan database upgrade 021 fiktif
        run: |
          node --input-type=module -e "import pg from 'pg'; const c = new pg.Client(); await c.connect(); await c.query(\"CREATE DATABASE nusacbt_upgrade_021_test ENCODING 'UTF8'\"); await c.end();"
      - name: Uji upgrade 020 ke kebijakan kategori
        env:
          PGDATABASE: nusacbt_upgrade_021_test
          NUSACBT_CONFIRM_TEST_DATABASE: nusacbt_upgrade_021_test
        run: npm run test:upgrade-021
