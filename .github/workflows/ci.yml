name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nusacbt_test
          POSTGRES_USER: nusacbt_test
          POSTGRES_PASSWORD: postgres-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: nusacbt_test
      PGUSER: nusacbt_test
      PGPASSWORD: postgres-test-only
      NUSACBT_COOKIE_SECURE: "false"
      TEST_ADMIN_USERNAME: admin_tes
      TEST_ADMIN_PASSWORD: admin-password-test-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      # File uji dibuat acak di luar checkout dan tidak pernah diunggah sebagai artefak.
      - run: |
          echo "NUSACBT_PARTICIPANT_KEY_FILE=${RUNNER_TEMP}/nusacbt-participant-test.key" >> "$GITHUB_ENV"
          echo "NUSACBT_EXAM_TOKEN_KEY_FILE=${RUNNER_TEMP}/nusacbt-token-test.key" >> "$GITHUB_ENV"
          npm run participant:key:create -- "${RUNNER_TEMP}/nusacbt-participant-test.key"
          npm run token:key:create -- "${RUNNER_TEMP}/nusacbt-token-test.key"
      - run: npm run db:migrate && npm run db:migrate
      - run: printf '%s' "$TEST_ADMIN_PASSWORD" | npm run admin:create -- "$TEST_ADMIN_USERNAME" --stdin
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
